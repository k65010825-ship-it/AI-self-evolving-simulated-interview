openapi: 3.1.0
info:
  title: Interview Agent Workbench API
  version: 0.1.0
  description: 仅 /health 已实现。其余为规划契约，当前返回 501；错误码详见 error-handling.md。
  license:
    name: Private project; licensing not yet declared
servers:
  - url: http://127.0.0.1:3100
    description: 本地开发 API，生产必须 HTTPS
paths:
  /health:
    get:
      operationId: getHealth
      summary: 读取骨架健康状态
      security: []
      responses:
        "200":
          description: 当前仅 scaffold，模型未配置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500": &a1
          $ref: "#/components/responses/Problem"
  /v1/roles:
    get:
      operationId: listRoles
      summary: 岗位清单
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 200
      security:
        - BearerAuth: []
      parameters: &a2
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 目标成功响应；尚未实现，当前骨架实际返回 501。
        "401": *a1
        "403": *a1
        "422": *a1
        "429": *a1
        "501": *a1
  /v1/interviews:
    get:
      operationId: listInterviews
      summary: 当前用户面试记录
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 200
      security:
        - BearerAuth: []
      parameters: *a2
      responses:
        "200":
          description: 目标成功响应；尚未实现，当前骨架实际返回 501。
        "401": *a1
        "403": *a1
        "422": *a1
        "429": *a1
        "501": *a1
    post:
      operationId: createInterview
      summary: 创建面试
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 201
      security:
        - BearerAuth: []
      parameters: []
      responses:
        "201":
          description: 目标成功响应；尚未实现，当前骨架实际返回 501。
        "401": *a1
        "403": *a1
        "422": *a1
        "429": *a1
        "501": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - roleId
                - goal
                - durationMinutes
              properties:
                roleId:
                  type: string
                  enum:
                    - java-backend
                    - web-frontend
                goal:
                  type: string
                  minLength: 1
                  maxLength: 500
                durationMinutes:
                  type: integer
                  minimum: 15
                  maximum: 25
  /v1/interviews/{interviewId}:
    get:
      operationId: getInterview
      summary: 查询本人面试状态
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 200
      security:
        - BearerAuth: []
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 目标成功响应；尚未实现，当前骨架实际返回 501。
        "401": *a1
        "403": *a1
        "422": *a1
        "429": *a1
        "501": *a1
  /v1/interviews/{interviewId}/answers:
    post:
      operationId: submitAnswer
      summary: 幂等提交回答
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 202
      security:
        - BearerAuth: []
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "202":
          description: 目标成功响应；尚未实现，当前骨架实际返回 501。
        "401": *a1
        "403": *a1
        "422": *a1
        "429": *a1
        "501": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sessionVersion
                - answer
              properties:
                sessionVersion:
                  type: integer
                  minimum: 0
                answer:
                  type: string
                  minLength: 1
                  maxLength: 10000
