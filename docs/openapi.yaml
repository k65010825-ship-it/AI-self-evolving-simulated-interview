  /v1/experiments:
    post:
      operationId: createExperiment
      summary: 管理员创建评测任务
      description: 设计契约。当前骨架返回 501；目标状态由 x-target-status 记录，不代表已实现。
      x-implementation: planned
      x-target-status: 202
      security:
        - BearerAuth: []
      parameters: []
