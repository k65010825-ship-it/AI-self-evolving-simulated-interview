components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 正式认证尚未实现；会话撤销与归属检查由 API 负责。
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - service
        - stage
        - liveModelConfigured
        - capabilities
      properties:
        service:
          type: string
          enum:
            - api
            - agent
        stage:
          const: scaffold
        liveModelConfigured:
          const: false
        capabilities:
          type: array
          items:
            type: string
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
  responses:
    Problem:
      description: 结构化公开错误，未实现能力为 NOT_IMPLEMENTED。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:interview:error:not-implemented
            title: NOT_IMPLEMENTED
            status: 501
            code: NOT_IMPLEMENTED
            detail: 该能力尚未实现，当前为开发骨架。
            requestId: request-example
            retryable: false
